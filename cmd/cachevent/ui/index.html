:root {
  color-scheme: light;
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem; --text-3xl: 2.488rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms; --dur-short: 220ms;
  --z-sticky: 200; --z-toast: 500;
  --app-width: 1200px; --bar-h: 56px; --control-h: 36px;

  --color-paper: oklch(96% 0.011 85); --color-paper-2: oklch(99.5% 0.005 85); --color-paper-3: oklch(92% 0.016 85);
  --color-ink: oklch(18% 0.006 60); --color-ink-2: oklch(28% 0.008 60); --color-muted: oklch(44% 0.012 60); --color-rule: oklch(88% 0.013 85);
  --color-accent: oklch(70% 0.19 40); --color-accent-ink: oklch(18% 0.006 60); --color-accent-soft: oklch(91% 0.05 50); --color-focus: oklch(60% 0.19 40);
  --color-green: oklch(48% 0.11 150); --color-green-soft: oklch(92% 0.04 150);
  --color-grid: oklch(90% 0.014 85); --color-sheet: oklch(99.3% 0.004 85);
  --color-error: oklch(52% 0.19 27); --color-error-soft: oklch(94% 0.03 27);
  --color-shade: oklch(18% 0.006 60 / 0.1); --color-scrim: oklch(18% 0.006 60 / 0.4);
  --font-display: "Segoe UI Variable Display", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  --font-outlier: "Cascadia Mono", ui-monospace, Consolas, monospace;
  --radius-card: 10px; --radius-entry: 14px; --radius-pill: 6px; --rule-hair: 1px;
  --shadow-lift: 0 1px 1px var(--color-shade), 0 2px 4px -1px var(--color-shade), 0 24px 44px -20px var(--color-scrim);

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: calc(var(--bar-h) + var(--space-lg)); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-weight: var(--body-weight); font-size: var(--text-md); line-height: 1.5; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent); }

<script>

const token = location.hash.slice(1);
const $ = (id) => document.getElementById(id);
const DAY = 864e5, SMALL = 10 << 20;

let state = null, lastKey = "", scope = "drives", view = "disk", noticeTimer = 0, drive = "";

// h builds elements; strings always become text nodes, never HTML.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "indeterminate" || k === "checked") el[k] = !!v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
function human(n) {

  const u = "KMGTPE"; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return (n >= 100 ? n.toFixed(0) : n.toFixed(1)) + " " + u[i] + "B";
}
function ago(t) {

// prose turns `code` spans in definition text into <code>, as text nodes only.
const prose = (t) => String(t || "").split("`").map((part, i) => i % 2 ? h("code", {}, part) : part);

const driveOf = (p) => /^[a-z]:/i.test(p) ? p.slice(0, 2).toUpperCase() : "/";

const chip = (s) => h("span", { class: "chip c-" + verdict(s)[1] }, verdict(s)[0]);

function notice(msg, bad, action) {
  clearTimeout(noticeTimer);

async function api(path, body) {
  const r = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": token, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!r.ok) throw new Error((await r.text()).trim() || r.statusText);
  return r.status === 202 || r.status === 204 ? null : r.json();
}
function ask(title, meta, body, yes, risky) {
  return new Promise((resolve) => {
    $("d-title").textContent = title;
    $("d-meta").textContent = meta;
    $("d-body").replaceChildren(body);
    $("d-yes").textContent = yes;
    $("d-yes").className = "key " + (risky ? "risky" : "primary");
    const dlg = $("dlg");
    $("d-yes").onclick = () => { dlg.close(); resolve(true); };
    $("d-no").onclick = () => { dlg.close(); resolve(false); };
    dlg.oncancel = () => resolve(false);
    dlg.showModal();
    $("d-no").focus();
  });
}

async function refresh() {
  try { state = await api("/api/state"); }
  catch (e) {
    notice("Cache Vent stopped answering. Close this window and open the app again.", true);
    return;
  }
  const scanning = state.scanning;
  $("scan").disabled = scanning;
  $("scan").setAttribute("aria-busy", scanning ? "true" : "false");
  $("scan").textContent = scanning ? "Reading " + state.dirs.toLocaleString() + " folders" : state.scan ? "Scan again" : "Scan";
  if (state.scan_error && !scanning) notice("The scan failed: " + state.scan_error, true, h("button", { class: "key", type: "button", onclick: startScan }, "Try again"));
  const key = (state.scan?.scanned_at || "") + "|" + state.quarantine.length + "|" + scanning;
  if (key !== lastKey) { lastKey = key; render(); }
  clearTimeout(refresh.t);
  refresh.t = setTimeout(refresh, scanning ? 700 : 5000);
}

function renderScope() {
  for (const b of document.querySelectorAll(".scope button")) b.setAttribute("aria-checked", b.dataset.scope === scope ? "true" : "false");
  $("roots").hidden = scope !== "custom";
  const d = state?.drives || [];
  document.querySelector('[data-scope="drives"]').title = d.length ? "Searches " + d.join(", ") : "";
}

// groups puts items of one definition together, biggest first.
function groups(filtered) {
  const q = filtered ? $("f-text")?.value.trim().toLowerCase() : "";
  const by = new Map();
  for (const it of shown()) {
    if (filtered && $("f-clean")?.checked && !it.cleanable) continue;
    if (q && !(it.name + " " + it.path).toLowerCase().includes(q)) continue;
    if (!by.has(it.id)) by.set(it.id, { id: it.id, name: it.name, items: [] });
    by.get(it.id).items.push(it);
  }
  const out = [...by.values()].map((g) => ({ ...g, bytes: sum(g.items),
    newest: g.items.reduce((a, i) => (i.last_used || "") > a ? i.last_used : a, ""),
    safety: new Set(g.items.map((i) => verdict(i.safety)[1])).size === 1 ? g.items[0].safety : "mixed" }));
  return out.filter((g) => !filtered || !$("f-small")?.checked || g.bytes >= SMALL || g.items.some((i) => selected.has(i.path)))
    .sort((a, b) => b.bytes - a.bytes);
}

// squarify lays values (sorted, biggest first) into w x h as near-square tiles.
function squarify(vals, w, h0) {
  const total = vals.reduce((a, v) => a + v.v, 0) || 1, scale = w * h0 / total;
  let x = 0, y = 0, W = w, H = h0, row = [];
  const out = [], area = (r) => r.reduce((a, v) => a + v.a, 0);
  const worst = (r, len) => { const s = area(r); let m = 0; for (const v of r) m = Math.max(m, len * len * v.a / (s * s), s * s / (len * len * v.a)); return m; };
  const place = (r) => {
    const s = area(r);
    if (W >= H) { const t = s / H; let yy = y; for (const v of r) { const hh = v.a / t; out.push({ ...v, x, y: yy, w: t, h: hh }); yy += hh; } x += t; W -= t; }
    else { const t = s / W; let xx = x; for (const v of r) { const ww = v.a / t; out.push({ ...v, x: xx, y, w: ww, h: t }); xx += ww; } y += t; H -= t; }
  };
  for (const v0 of vals) {
    const v = { ...v0, a: v0.v * scale }, len = Math.min(W, H);
    if (row.length && worst(row.concat(v), len) > worst(row, len)) { place(row); row = []; }
    row.push(v);
  }
  if (row.length) place(row);
  return out;
}

function drawPlan() {
  const plan = $("plan");
  if (!plan) return;
  const all = groups(false).filter((g) => g.bytes > 0);
  const top = all.slice(0, 12), rest = all.slice(12);
  const vals = top.map((g) => ({ v: g.bytes, g }));
  if (rest.length) vals.push({ v: sum(rest), rest: rest.length });
  const W = plan.clientWidth, H = plan.clientHeight;
  plan.replaceChildren(...squarify(vals, W, H).map((t) => {
    const style = `left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px`;
    const roomy = t.w > 84 && t.h > 44, label = t.rest ? "Everything else, " + t.rest + " tools" : t.g.name;
    if (t.rest) return h("div", { class: "plot rest", style, title: label + ", " + human(t.v) }, roomy ? [h("span", { class: "n" }, label), h("span", { class: "b num" }, human(t.v))] : []);
    const g = t.g, picked = g.items.some((i) => selected.has(i.path));
    return h("button", { type: "button", class: "plot " + verdict(g.safety)[1] + (picked ? " picked" : ""), style,
      title: g.name + ", " + human(g.bytes), "aria-label": g.name + ", " + human(g.bytes) + ", " + verdict(g.safety)[0] + ". Show in the list",
      onclick: () => jumpTo(g.id) },
      roomy ? [h("span", { class: "n" }, g.name), h("span", { class: "b num" }, human(g.bytes))] : []);
  }));
}

// checkbox selects the cleanable items among its; it is disabled when none are.
function checkbox(its) {
  const can = its.filter((i) => i.cleanable), picked = can.filter((i) => selected.has(i.path)).length;
  const why = can.length ? "Select to move to quarantine" : its[0].safety === "user-data" ? "Your data is never cleaned" : "Not verified, so never cleaned";
  return h("label", { class: "hit", title: why }, h("input", { type: "checkbox", disabled: !can.length,
    checked: can.length > 0 && picked === can.length, indeterminate: picked > 0 && picked < can.length,
    "aria-label": why, onchange: (e) => { for (const i of can) e.target.checked ? selected.add(i.path) : selected.delete(i.path); changed(); } }));
}

function renderTable() {

    if (g.items.length === 1) { const r = itemRows(g.items[0], false); r[0].dataset.group = g.id; return r; }

    const head = h("tr", { class: "group", "data-group": g.id },

function sharedBlock() {
  const byKey = new Map();
  for (const it of shown()) for (const p of it.env?.packages || []) {
    if (!p.other_envs) continue;
    const k = p.name + " " + p.version, d = byKey.get(k) || { k, bytes: 0, envs: 0 };
    d.bytes += p.bytes; d.envs++; byKey.set(k, d);
  }
  const dups = [...byKey.values()].filter((d) => d.bytes - d.bytes / d.envs >= 50 << 20).sort((a, b) => b.bytes - a.bytes).slice(0, 8);
  if (!dups.length) return null;
  return h("section", { class: "block" },
    h("div", { class: "block-h" }, h("h2", {}, "Installed more than once"),
      h("p", { class: "muted" }, "uv can share one copy across environments. ", h("a", { href: "https://docs.astral.sh/uv/concepts/cache/", target: "_blank", rel: "noopener" }, "How uv caches"))),
    h("ul", { class: "ruled" }, dups.map((d) => h("li", {}, h("span", { class: "num" }, d.k), h("span", { class: "num" }, d.envs + " envs, " + human(d.bytes))))));
}

function toggle(set, k) { set.has(k) ? set.delete(k) : set.add(k); }

function roots() {
  if (scope === "drives") return state.drives || [];
  if (scope === "custom") return $("roots").value.split(";").map((s) => s.trim()).filter(Boolean);
  return [];

async function startScan(keepNotice) {
  if (scope === "custom" && !roots().length) { notice("Type one or more folders, separated by semicolons.", true); $("roots").focus(); return; }
  try { await api("/api/scan", { roots: roots() }); if (keepNotice !== true) $("notice").hidden = true; lastKey = ""; refresh(); } catch (e) { notice(e.message, true); }
}

async function moveSelected() {
  const paths = [...selected];
  let targets;
  try { targets = await api("/api/plan", { paths }); } catch (e) { notice(e.message, true); return; }
  if (!targets.length) { notice("Nothing selected is old enough to move yet."); return; }
  const total = targets.reduce((a, t) => a + t.Bytes, 0);
  const body = h("div", { style: "display:grid;gap:var(--space-sm)" },
    h("p", {}, "These are moved, not deleted. You can restore any of them for " + state.max_age_days + " days."),
    h("div", { class: "targets num" }, targets.map((t) => h("div", {}, h("span", {}, human(t.Bytes)), h("span", {}, t.Path)))));
  if (!await ask("Move to quarantine", targets.length + " items, " + human(total), body, "Move " + human(total))) return;
  $("move").disabled = true; $("move").setAttribute("aria-busy", "true"); $("move").textContent = "Moving";
  try {
    const r = await api("/api/clean", { paths });
    selected.clear(); lastKey = "";
    const ids = r.moved.map((m) => m.id);
    notice("Freed " + human(r.bytes) + ". It stays in quarantine for " + state.max_age_days + " days." + (r.failed.length ? " Skipped " + r.failed.length + ": " + r.failed[0] : ""), r.failed.length > 0,
      ids.length ? h("button", { class: "key", type: "button", onclick: () => restoreIDs(ids, "Undone. Everything is back where it was.") }, "Undo") : null);
    refresh();
  } catch (e) { notice(e.message, true); }
  $("move").disabled = false; $("move").setAttribute("aria-busy", "false"); $("move").textContent = "Move to quarantine";
}
// restoreIDs puts items back, then rescans so they show up in the list again.
// deleteSelected skips the quarantine: the confirm says so and offers the safe move instead.
async function deleteSelected() {
  const paths = [...selected];
  let targets;
  try { targets = await api("/api/plan", { paths }); } catch (e) { notice(e.message, true); return; }
  if (!targets.length) { notice("Nothing selected is old enough to delete yet."); return; }
  const total = targets.reduce((a, t) => a + t.Bytes, 0);
  const body = h("div", { style: "display:grid;gap:var(--space-sm)" },
    h("p", {}, h("strong", {}, "This cannot be undone."), " These are deleted now and skip the quarantine. To keep a way back for " + state.max_age_days + " days, use Move to quarantine instead."),
    h("div", { class: "targets num" }, targets.map((t) => h("div", {}, h("span", {}, human(t.Bytes)), h("span", {}, t.Path)))));
  if (!await ask("Delete for good", targets.length + " items, " + human(total), body, "Delete " + human(total), true)) return;
  const btn = $("del");
  btn.disabled = true; btn.setAttribute("aria-busy", "true");
  try {
    const r = await api("/api/delete", { paths });
    selected.clear(); lastKey = "";
    notice("Deleted " + human(r.bytes) + " for good." + (r.failed.length ? " Skipped " + r.failed.length + ": " + r.failed[0] : ""), r.failed.length > 0);
    refresh();
  } catch (e) { notice(e.message, true); }
  btn.disabled = false; btn.setAttribute("aria-busy", "false");
}

async function restoreIDs(ids, msg) {
  try { await api("/api/restore", { ids }); notice(msg); lastKey = ""; await refresh(); if (!state.scanning) startScan(true); }
  catch (e) { notice(e.message, true); }
}
const restore = (m) => restoreIDs([m.id], "Put back " + m.original_path + ".");
async function purgeAll() {
  const total = sum(state.quarantine);
  if (!await ask("Delete for good", human(total), h("p", {}, "This empties the quarantine now instead of after " + state.max_age_days + " days. It cannot be undone."), "Delete " + human(total), true)) return;
  try { const r = await api("/api/purge", {}); notice("Deleted " + human(r.bytes) + " for good."); lastKey = ""; refresh(); } catch (e) { notice(e.message, true); }
}
function show(name) {
  view = name;
  $("disk").hidden = name !== "disk"; $("quar").hidden = name !== "quar";
  $("t-disk").setAttribute("aria-selected", name === "disk" ? "true" : "false");
  $("t-quar").setAttribute("aria-selected", name === "quar" ? "true" : "false");
  history.replaceState(null, "", "?view=" + name + location.hash);
  renderBar();
}

for (const b of document.querySelectorAll(".scope button")) b.onclick = () => {
  scope = b.dataset.scope; try { localStorage.setItem("scope", scope); } catch {}
  renderScope();
  if (scope === "custom") { $("roots").focus(); if (!roots().length) return; }
  if (!state?.scanning) startScan();
};
$("roots").oninput = () => { try { localStorage.setItem("roots", $("roots").value); } catch {} };
$("roots").onkeydown = (e) => { if (e.key === "Enter") startScan(); };
$("scan").onclick = startScan;
function syncMode() {
  const dark = document.documentElement.dataset.mode === "dark";
  $("mode").textContent = dark ? "Light mode" : "Dark mode";
  $("mode").setAttribute("aria-pressed", dark ? "true" : "false");
}
$("mode").onclick = () => {
  const dark = document.documentElement.dataset.mode !== "dark";
  if (dark) document.documentElement.dataset.mode = "dark"; else delete document.documentElement.dataset.mode;
  try { localStorage.setItem("mode", dark ? "dark" : "light"); } catch {}
  syncMode();
};
syncMode();
// Links leave the app: the server opens known source links in the default browser.
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href^='https://']");
  if (!a) return;
  e.preventDefault();
  api("/api/open", { url: a.href }).catch((err) => notice(err.message, true));
});
$("move").onclick = moveSelected;
$("del").onclick = deleteSelected;
$("clear").onclick = () => { selected.clear(); changed(); };
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("dlg").open && selected.size && e.target.tagName !== "INPUT") { selected.clear(); changed(); }
});
$("t-disk").onclick = () => show("disk");
$("t-quar").onclick = () => show("quar");
$("home").onclick = (e) => { e.preventDefault(); show("disk"); };
new ResizeObserver(() => drawPlan()).observe(document.body);
show(new URLSearchParams(location.search).get("view") === "quar" ? "quar" : "disk");
renderScope();
refresh();
</script>
</body>
</html>
